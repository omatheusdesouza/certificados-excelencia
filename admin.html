<style>
:root { --paper:#edf2f2; --surface:#fff; --ink:#14252b; --muted:#55686e; --line:#cdd8d9; --accent:#1f6a70; --accent-strong:#154e53; --on-accent:#fff; --err-ink:#8f2f1c; --err-bg:#fbebe6; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --paper:#0e1a1d; --surface:#16262a; --ink:#e7efef; --muted:#9db0b4; --line:#2a3e43; --accent:#5fc3c7; --accent-strong:#86d8db; --on-accent:#06282b; --err-ink:#ffb7a6; --err-bg:#3a1d17; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; padding:1.25rem; background:var(--paper); color:var(--ink); font-family:"Segoe UI", system-ui, -apple-system, sans-serif; line-height:1.5; }
.card { width:100%; max-width:24rem; background:var(--surface); border:1px solid var(--line); border-radius:0.75rem; padding:1.5rem; display:flex; flex-direction:column; gap:1rem; }
.org { margin:0; font-size:0.75rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--accent); }
h1 { margin:0; font-size:1.5rem; line-height:1.15; }
p { margin:0; color:var(--muted); font-size:0.9375rem; }
label { font-weight:600; font-size:0.875rem; display:block; margin-bottom:0.3rem; }
input { font:inherit; color:inherit; background:var(--surface); border:1px solid var(--line); border-radius:0.5rem; padding:0.6rem 0.75rem; width:100%; min-height:2.75rem; }
button { font:inherit; font-weight:600; color:var(--on-accent); background:var(--accent); border:0; border-radius:0.5rem; padding:0.7rem 1rem; min-height:2.75rem; cursor:pointer; }
button:hover { background:var(--accent-strong); }
button[disabled] { opacity:0.6; cursor:progress; }
:is(input,button):focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
.status { min-height:1.4em; }
.status.alert { color:var(--err-ink); background:var(--err-bg); border-radius:0.5rem; padding:0.6rem 0.75rem; }
</style>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var blob = JSON.parse($('blob').textContent);
  var say = function (t, alert) { $('st').textContent = t; $('st').className = 'status' + (alert ? ' alert' : ''); };
  function b64(s) { var b = atob(s), o = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) o[i] = b.charCodeAt(i); return o; }
  /* a senha não diferencia maiúsculas, espaços nem hífens */
  function norm(s) { return String(s).trim().toLowerCase().replace(/[\s-]+/g, ''); }
  $('f').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    if (!(window.crypto && crypto.subtle)) { say('Este navegador não consegue abrir a área. Use um navegador atualizado e o endereço https.', true); return; }
    var pw = norm($('pw').value);
    if (!pw) { say('Digite a senha.', true); return; }
    $('go').disabled = true; say('Verificando…');
    var html;
    try {
      var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
      var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(blob.salt), iterations: blob.iter }, base,
        { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(blob.iv) }, key, b64(blob.ct)));
    } catch (e) {
      $('go').disabled = false; $('pw').select(); say('Senha incorreta.', true); return;
    }
    document.open(); document.write(html); document.close();
  });
})();
</script>
